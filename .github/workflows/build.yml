name: Build Sanemi APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cache Buildozer Global Directory
      uses: actions/cache@v3
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git wget curl unzip libltdl-dev \
          openjdk-17-jdk autoconf libtool pkg-config \
          zlib1g-dev libncurses-dev libstdc++6 \
          libffi-dev libssl-dev autopoint

    - name: Install Python Build Tools & Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade Cython==0.29.36 buildozer kivy yt-dlp

    - name: Run Buildozer Build
      run: |
        buildozer -v android debug

    - name: Upload Final APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sanemi-downloader-apk
        path: bin/*.apk
